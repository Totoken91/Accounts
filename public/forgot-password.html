<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Mot de passe oublié</h1>
    <p class="subtitle">Saisis ton email, on t'envoie un lien de réinitialisation.</p>

    <div id="message" class="message hidden"></div>

    <form id="forgotForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="jean@exemple.com" required>

      <button type="submit" class="btn">Envoyer le lien</button>
    </form>

    <p class="footer-link"><a href="/login.html">← Retour à la connexion</a></p>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Envoi en cours…';

      const res = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value }),
      });

      const result = await res.json();
      const msgEl = document.getElementById('message');
      msgEl.classList.remove('hidden', 'success', 'error');

      if (res.ok) {
        msgEl.textContent = result.message;
        msgEl.classList.add('success');
        e.target.classList.add('hidden'); // cache le formulaire après envoi
      } else {
        msgEl.textContent = result.error;
        msgEl.classList.add('error');
        btn.disabled = false;
        btn.textContent = 'Envoyer le lien';
      }
    });
  </script>
</body>
</html>
