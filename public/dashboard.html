<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Tableau de bord</h1>

    <div id="userInfo">
      <p>Chargement...</p>
    </div>

    <button id="logoutBtn" class="btn btn-danger">Se déconnecter</button>
  </div>

  <script>
    // On demande au serveur les infos de l'utilisateur connecté
    fetch('/api/me')
      .then(res => {
        if (!res.ok) {
          // Si pas connecté, le serveur redirige vers /login.html
          window.location.href = '/login.html';
          return;
        }
        return res.json();
      })
      .then(user => {
        if (!user) return;
        // On utilise textContent (jamais innerHTML avec des données utilisateur → risque XSS)
        const info = document.getElementById('userInfo');
        info.innerHTML = '<p></p><p></p><p></p>';
        const [p1, p2, p3] = info.querySelectorAll('p');
        p1.innerHTML = '<strong>Nom d\'utilisateur :</strong> ';
        p1.append(user.username);
        p2.innerHTML = '<strong>Email :</strong> ';
        p2.append(user.email);
        p3.innerHTML = '<strong>Membre depuis :</strong> ';
        p3.append(new Date(user.created_at).toLocaleDateString('fr-FR'));
      });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
