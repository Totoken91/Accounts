<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Nouveau mot de passe</h1>

    <div id="message" class="message hidden"></div>

    <form id="resetForm">
      <label for="password">Nouveau mot de passe</label>
      <input type="password" id="password" name="password" placeholder="Au moins 8 caractères" minlength="8" required>
      <small>8 caractères minimum, avec une majuscule et un chiffre.</small>

      <button type="submit" class="btn">Mettre à jour</button>
    </form>

    <p class="footer-link"><a href="/login.html">← Retour à la connexion</a></p>
  </div>

  <script>
    // Récupère le token depuis l'URL : /reset-password.html?token=abc123...
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      document.getElementById('message').textContent = 'Lien invalide.';
      document.getElementById('message').classList.remove('hidden');
      document.getElementById('message').classList.add('error');
      document.getElementById('resetForm').classList.add('hidden');
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token,
          password: document.getElementById('password').value,
        }),
      });

      const result = await res.json();
      const msgEl = document.getElementById('message');
      msgEl.classList.remove('hidden', 'success', 'error');

      if (res.ok) {
        msgEl.textContent = result.message;
        msgEl.classList.add('success');
        document.getElementById('resetForm').classList.add('hidden');
        setTimeout(() => window.location.href = '/login.html', 2000);
      } else {
        msgEl.textContent = result.error;
        msgEl.classList.add('error');
      }
    });
  </script>
</body>
</html>
